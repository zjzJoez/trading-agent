[project]
name = "trading-agent"
version = "0.1.0"
description = "Senior-trader Claude Code agent: paper trading, research, self-learning."
readme = "README.md"
authors = [
    { name = "JoezZz" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    # Phase 1 — Claude Code MCP + broker + RAG journal
    "mcp>=1.2.0",
    "moomoo-api>=9.3.5308",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "lxml>=5.2.0",
    # Phase 2 v3 — autonomous orchestrator on EC2
    "langgraph>=0.2.50",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "hmmlearn>=0.3.2",
    "scikit-learn>=1.5.0",
    "pandas-market-calendars>=4.4.0",
    "scipy>=1.13.0",
    # LLM output is best-effort JSON; json-repair fixes common LLM quirks
    # (trailing commas, missing delimiters, unescaped newlines) before we
    # spend another LLM round-trip on a retry.
    "json-repair>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[project.scripts]
moomoo-mcp = "trading_agent.mcp_servers.moomoo.server:main"
edgar-mcp = "trading_agent.mcp_servers.edgar.server:main"
journal-mcp = "trading_agent.mcp_servers.journal.server:main"
ta-migrate = "trading_agent.db:migrate_cli"
ta-pg-migrate = "trading_agent.store.postgres:migrate_cli"
ta-brain = "trading_agent.orchestrator:main"
ta-ntfy-test = "trading_agent.notify.ntfy:cli_test"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
